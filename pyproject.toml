[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reflection-ai"
version = "0.2.0"
description = "Provider-agnostic continuous AI personalization framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1"]
memory-mem0 = ["mem0ai>=2,<3"]
memory-hindsight = ["hindsight-client>=0.8,<1"]
memory = ["mem0ai>=2,<3", "hindsight-client>=0.8,<1"]

[project.scripts]
reflection-ai = "reflection_ai.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/reflection_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
